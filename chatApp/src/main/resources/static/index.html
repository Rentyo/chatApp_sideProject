<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat Room Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .hidden { display: none; }
        #login-page, #chat-page { max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        #chat-content { list-style-type: none; padding: 0; max-height: 300px; overflow-y: auto; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        #chat-content li { padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
        input[type="text"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .input-group { display: flex; gap: 5px; }
        .input-group input { flex-grow: 1; margin-bottom: 0; }
        .input-group button { width: auto; }
    </style>
</head>
<body>

<!-- Login Page -->
<div id="login-page">
    <h2 style="text-align: center;">Join Chat Room</h2>
    <input type="text" id="nickname" placeholder="Enter Nickname" value="User1">
    <input type="text" id="roomId" placeholder="Enter Room ID (Number)" value="1">
    <button onclick="connect()">Enter Chat</button>
</div>

<!-- Chat Page -->
<div id="chat-page" class="hidden">
    <h2 id="room-header" style="text-align: center;">Chat Room</h2>
    <hr>
    <ul id="chat-content">
        <!-- Messages will be added here -->
    </ul>
    <div class="input-group">
        <input type="text" id="message" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    var stompClient = null;
    var currentRoomId = null;
    var currentNickname = null;

    function connect() {
        var nicknameInput = document.getElementById('nickname').value;
        var roomIdInput = document.getElementById('roomId').value;

        if (!nicknameInput || !roomIdInput) {
            alert("Please enter both nickname and room ID.");
            return;
        }

        currentNickname = nicknameInput;
        currentRoomId = roomIdInput;

        var socket = new SockJS('/ws-chat'); // Must match WebSocketConfig endpoint
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            onConnected();
        }, function(error) {
            console.error('Connection error: ' + error);
            alert('Could not connect to WebSocket server. Please check if the server is running.');
        });
    }

    function onConnected() {
        // UI toggle
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('chat-page').classList.remove('hidden');
        document.getElementById('room-header').innerText = 'Room: ' + currentRoomId;

        // Subscribe to the specific room topic
        stompClient.subscribe('/topic/room/' + currentRoomId, function (response) {
            showMessage(JSON.parse(response.body));
        });
    }

    function sendMessage() {
        var messageInput = document.getElementById('message');
        var content = messageInput.value;

        if(content && stompClient) {
            var chatMessage = {
                type: 'TALK',
                roomId: currentRoomId,
                senderId: 1, // Temporary dummy ID used in testing
                nickname: currentNickname, 
                content: content
            };

            // Publish message
            stompClient.send("/app/chat/send", {}, JSON.stringify(chatMessage));
            messageInput.value = '';
        }
    }

    function showMessage(message) {
        var chatContent = document.getElementById('chat-content');
        var li = document.createElement('li');
        
        var sender = document.createElement('strong');
        sender.textContent = message.nickname + ": ";
        
        var text = document.createElement('span');
        text.textContent = message.content;

        li.appendChild(sender);
        li.appendChild(text);
        
        chatContent.appendChild(li);
        
        // Auto scroll to bottom
        chatContent.scrollTop = chatContent.scrollHeight;
    }
    
    // Allow pressing Enter to send message
    document.getElementById("message").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
